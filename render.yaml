services:
  - type: web
    name: attendance-ms-api
    runtime: node
    rootDir: .                        # repo root so we can reach both client/ and server/
    buildCommand: |
      cd client && npm install && npm run build && cd ../server && npm install
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: QR_SECRET
        sync: false
      # ALLOWED_ORIGINS not needed — frontend is served by the same Express server
    healthCheckPath: /health
